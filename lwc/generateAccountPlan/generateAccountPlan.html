                    </div>

                        <span class="slds-page-header__title" title={nameField}>{nameField}</span>
                    </div>
                </div>
            </div>


            <!-- This is the logic to show the button in Highlight Pannel(on basis of Account Status) -->
            <div class="slds-page-header__col-actions">

                        <lightning-button-group class="slds-m-top_small">
                            <div style="padding-left:10px">

                                <template if:true={showEditbutton}>
                                    <lightning-button label="Edit" onclick={handleEdit}></lightning-button>
                                </template>
                            </div>
                            <template if:true={checkUnapprovedStrat}>
                                <lightning-button label="Submit For Review"
                                    onclick={handleapproval} disabled={isFieldsChanged}></lightning-button></template>
                            <template if:true={checkStatus}>
                                <lightning-button label="Generate PDF"
                                    onclick={handleGeneratePDF} disabled={isFieldsChanged}></lightning-button>
                            </template>
                            <!--<lightning-button label="Clone" onclick={handleClone}></lightning-button>-->

                            <!-- This is the logic to show the button as drop arrow in Highlight Pannel -->
                            <template if:true={checkStatus}>

                                    <lightning-menu-item label="Print PDF" value="Print"

                                </lightning-button-menu></template>
                            <template if:false={checkStatus}>
                                <lightning-button label="Print PDF" value="Print"
                                    onclick={handlePrintPDF}></lightning-button>
                            </template>

                        </lightning-button-group>
                    </div>
                </div>
            </div>
