<template>
    <div style={modalresize}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container slds-is-relative">

                <div class="slds-is-relative">
                    <template lwc:if={showSpinner}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                    <div class="slds-modal__header">
                <!-- Close button -->
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={handleCloseReparent}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                        size="small">
                    </lightning-icon>
                    <span class="slds-assistive-text">Cancel and close</span>
                </button>
                
                    <!-- Modal title -->
                    <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate">Reparent</h1>
                </div>
                <div class="slds-modal__content slds-p-around_small" id="modal-content-id-3">
                    <lightning-card title="Please select a new parent for the contact/placeholder" icon-name="action:change_owner">
                    <p class="note">* Select the Account in the below table to add the node at the top level </p>
                        <div class="slds-border_left slds-border_right slds-border_top slds-border_bottom max-height">
                        <template lwc:if={showSpinner}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>
                    <lightning-datatable key-field="Id"
                        data={allEligibleNodes}
                        onrowselection={handleRowSelection}
                        columns={columns}
                        max-row-selection="1">
                    </lightning-datatable>
                    </div>
                </lightning-card>
                </div>
                <div class="slds-modal__footer">
                    <!-- Cancel and Save buttons -->
                    <button class="slds-button slds-button_neutral" aria-label="Cancel and close"
                        onclick={handleCloseReparent}>Cancel</button>
                  <!-- Save button -->
                    <button class="slds-button slds-button_brand" disabled={isReparentDisabled}
                    onclick={handleReparent}>Reparent</button>
                </div>
                </div>
            </div>
        </section>
        <!-- Modal backdrop -->
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </div>
</template>
