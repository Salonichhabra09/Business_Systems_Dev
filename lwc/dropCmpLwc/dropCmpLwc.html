<template>
    <lightning-card ondrop={dropElement} ondragover={DragOver}>
        <template if:false={showSubmit}>
            <div class="slds-align_absolute-center">Drop Here</div>
        </template>
        <div if:true={textinput}>
            <lightning-layout multiple-rows class="limitVert">
                <template for:each={allvalue} for:item="acc" for:index="index">
                    <lightning-layout-item size="12" padding="around-small" key={acc.Id}>
                        <!--<div class="slds-p-around_x-small">-->
                        <div class="slds-grid">
                            <div class="slds-col slds-size_10-of-12">
                                <div if:true={acc.issection}>
                                    <br>
                                    <strong>{acc.fieldLabel}</strong>
                                    <hr class="solid">
                                </div>
                                <div if:true={acc.isnormal} class={acc.cssClass}>
                                    <lightning-input if:true={acc.isMandatory} type={acc.fieldtype}
                                        label={acc.fieldLabel} data-index={acc.index} onchange={handleInputChange}
                                        value={acc.value} field-level-help={acc.helpText} disabled=true>
                                    </lightning-input>
                                    <lightning-input if:false={acc.isMandatory} type={acc.fieldtype}
                                        label={acc.fieldLabel} data-index={acc.index} onchange={handleInputChange}
                                        value={acc.value} field-level-help={acc.helpText} required={acc.isRequired}
                                        checked={acc.value} message-when-value-missing=" ">
                                    </lightning-input>
                                </div>
                                <div if:true={acc.istextarea}>
                                    <lightning-textarea name="input1" label={acc.fieldLabel} required={acc.isRequired}
                                        data-index={acc.index} onchange={handleInputChange} value={acc.value}
                                        field-level-help={acc.helpText}
                                        message-when-value-missing=" "></lightning-textarea>
                                </div>
                                <div if:true={acc.isrichtexarea}>
                                    <lightning-input-rich-text label={acc.fieldLabel} required={acc.isRequired}
                                        data-index={acc.index} onchange={handleInputChange} value={acc.value}
                                        field-level-help={acc.helpText} message-when-value-missing=" ">
                                    </lightning-input-rich-text>
                                </div>
                                <div if:true={acc.ispicklist}>
                                    <lightning-combobox name={acc.fieldLabel} label={acc.fieldLabel} value={acc.value}
                                        placeholder="Select a Value" options={acc.options} onchange={handleInputChange}
                                        required={acc.isRequired} data-index={acc.index} field-level-help={acc.helpText}
                                        dropdown-alignment="auto" message-when-value-missing=" ">
                                    </lightning-combobox>
                                </div>
                                <div if:true={acc.ischeckboxgroup}
                                    class="slds-grid slds-gutters slds-var-p-vertical_medium">
                                    <div class="slds-col slds-grid">
                                        <lightning-checkbox-group name={acc.fieldLabel} label={acc.fieldLabel}
                                            options={acc.options} value={acc.value} onchange={handleInputChange}
                                            required={acc.isRequired} data-index={acc.index}
                                            message-when-value-missing=" ">
                                        </lightning-checkbox-group>
                                        <lightning-helptext if:true={acc.helpText}
                                            content={acc.helpText}></lightning-helptext>
                                    </div>
                                </div>
                                <div if:true={acc.isradiogroup}
                                    class="slds-grid slds-gutters slds-var-p-vertical_medium">
                                    <div class="slds-col slds-grid">
                                        <lightning-radio-group name={acc.fieldLabel} label={acc.fieldLabel}
                                            options={acc.options} value={acc.value} type="radio"
                                            required={acc.isRequired} onchange={handleInputChange}
                                            data-index={acc.index}
                                            message-when-value-missing=" "></lightning-radio-group>
                                        <lightning-helptext if:true={acc.helpText}
                                            content={acc.helpText}></lightning-helptext>
                                    </div>
                                </div>
                            </div>

                            <div class="slds-col slds-size_2-of-12 slds-p-top_large">
                                <lightning-layout>
                                    <lightning-layout-item>
                                        <lightning-button-icon if:false={acc.isMandatory} name={acc.fieldtype}
                                            data-name={acc.fieldtype} icon-name="utility:edit" alternative-text="Edit"
                                            class="slds-m-left_xx-small" size='x-small' title="Edit"
                                            onclick={handleEditIcon} data-index={acc.index}></lightning-button-icon>
                                    </lightning-layout-item>
                                    <lightning-layout-item>
                                        <div if:false={acc.isNotDeletable}>
                                            <lightning-button-icon if:false={acc.isMandatory} name={acc.fieldtype}
                                                data-name={acc.fieldtype} icon-name="utility:delete"
                                                alternative-text="Delete" class="slds-m-left_xx-small" size='x-small'
                                                title="Delete" onclick={handleRemoveIcon}
                                                data-index={acc.index}></lightning-button-icon>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item>
                                        <lightning-button-icon name={acc.fieldtype} data-name={acc.fieldtype}
                                            icon-name="utility:chevronup" alternative-text="Move Up"
                                            class="slds-m-left_xx-small" size='x-small' title="Move Up"
                                            onclick={handleMoveUp} data-index={index}></lightning-button-icon>
                                        <lightning-button-icon name={acc.fieldtype} data-name={acc.fieldtype}
                                            icon-name="utility:chevrondown" alternative-text="Move Down"
                                            class="slds-m-left_xx-small" size='x-small' title="Move Down"
                                            onclick={handleMoveDown} data-index={index}></lightning-button-icon>
                                    </lightning-layout-item>
                                </lightning-layout>

                            </div>


                        </div>

                        <!--*****************************************************************************-->

                        <template lwc:if={acc.showEditFields}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                                <div class="slds-modal__container">

                                    <!--Header part of the Modal-->
                                    <header class="slds-modal__header">
                                        <button
                                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                            title="Close" onclick={cancelPreview} data-index={acc.index}>
                                            <lightning-icon icon-name="utility:close" alternative-text="close"
                                                variant="inverse" size="small" onclick={cancelPreview}
                                                data-index={acc.index}></lightning-icon>
                                            <span class="slds-assistive-text">Close</span>
                                        </button>
                                        <h2 id={acc.Id} class="slds-text-heading_medium slds-hyphenate">Form Field
                                        </h2>
                                    </header>
                                    <!--Header part of the Modal Ends-->

                                    <!--Body part of the Modal-->
                                    <div class="slds-modal__content slds-p-around_medium" id={acc.Id}>
                                        <lightning-input type="text" label="Required" data-labelname={acc.fieldtype}
                                            name={acc.fieldtype} placeholder="Enter Label Name" value={acc.fieldLabel}
                                            required=true data-index={acc.index}></lightning-input>

                                        <div class="slds-p-top_x-small" style="color:#444444">Data Type:
                                            {acc.fieldtype}</div>

                                        <lightning-input if:false={acc.issection} type="text"
                                            data-helptextname={acc.fieldtype} name={acc.fieldtype}
                                            placeholder="Enter Help Text" value={acc.helpText}
                                            data-index={acc.index}></lightning-input>

                                        <lightning-input if:false={acc.issection} type="toggle"
                                            data-togglename={acc.fieldtype} onchange={handleToggle} name={acc.fieldtype}
                                            value={acc.isRequired} size='xx-small' checked={acc.isRequired}
                                            message-toggle-active="Required" message-toggle-inactive="Not Required"
                                            class="slds-m-top_small" data-index={acc.index}>
                                        </lightning-input>

                                        <template lwc:if={acc.showTextFieldArea}>
                                            <lightning-textarea label="Required" data-name={acc.fieldtype}
                                                name={acc.fieldtype} placeholder="Enter Comma Seprated Values."
                                                value={acc.Values__c} class="slds-m-top_small" data-index={acc.index}
                                                required=true
                                                message-when-value-missing="Please enter comma seprated values"></lightning-textarea>
                                        </template>
                                    </div>
                                    <!--Body part of the Modal ends-->

                                    <!--Footer part of the Modal-->
                                    <footer class="slds-modal__footer">
                                        <button class="slds-button slds-button_neutral" onclick={cancelPreview}
                                            title="Cancel" data-index={acc.index} name={acc.fieldtype}>Cancel</button>
                                        <button class="slds-button slds-button_brand" onclick={handleFieldValues}
                                            title="Save" data-index={acc.index} name={acc.fieldtype}>Save</button>
                                    </footer>
                                    <!--Footer part of the Modal-->
                                </div>
                            </section>
                            <div class="slds-backdrop slds-backdrop_open"></div>
                        </template>

                        <!--*****************************************************************************-->
                        <!--</div>-->
                    </lightning-layout-item>

                </template>
            </lightning-layout>

            <!--<template lwc:if={showSubmit}>
            <lightning-button name="Submit" label="Submit" onclick={submitForm}></lightning-button>
            </template>-->
            <br>
            <br>
            <br>

        </div>
    </lightning-card>
</template>
