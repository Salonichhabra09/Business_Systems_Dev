<template>
    <lightning-card title="Approval History" icon-name="standard:approval">
        <lightning-button lwc:if={isRecallButtonVisible} variant="neutral" onclick={handleRecall} label="Recall" slot="actions"></lightning-button>                     
        <div lwc:if={hasData} class="slds-m-around_x-small slds-border_left slds-border_right slds-border_top slds-border_bottom">
            <lightning-datatable
                key-field="id"
                data={rows}
                columns={columns}
                hide-checkbox-column
                min-column-width="120"
                wrap-text-max-lines="20"
                column-widths-mode="Auto">
            </lightning-datatable>
            
        </div>
        <div lwc:else>
            <div class="slds-p-around_medium slds-text-body_small">
                    No approval submissions or work items found.
            </div>
        </div>

        <template lwc:if={isRecall}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container slds-is-relative">
                <!-- modal header start -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeRecallPopup}>
                        <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{header}</h2>
                </header>
            
                <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium slds-is-relative" id="modal-content-id-1">
                    <lightning-flow
                        flow-api-name='Discount_Approval_Recall_Approval_Submission'
                        flow-input-variables={inputVariables}
                        flow-finish-behavior = "None"
                        onstatuschange={handleStatusChange}>
                    </lightning-flow>
                </div>
            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
