<template>

    <template lwc:if={recordId}>
        <template lwc:if={ShowPreview}>

            <div style="height: fit-content; width: fit-content;">
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container slds-is-relative" style="width: 80%;
                    max-width: 80%;">
                        
                        <div class="slds-is-relative" style="height: 100%;">
                            <template if:true={showSpinner}>
                                <lightning-spinner alternative-text="Loading" size="small">

                                </lightning-spinner>
                            </template>

                            <!-- Modal/Popup Box LWC header here -->
                            <header class="slds-modal__header">
                                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                    title="Close" 
                                    onclick={closeModal}>
                                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                </button>
                            </header>

                            <!-- Modal/Popup Box LWC body starts here -->
                            <div class="slds-modal__content slds-p-around_medium" style="height: 100%;">
                                <iframe src={url}></iframe>
                            </div>

                            <!-- Modal/Popup Box LWC footer starts here -->
                            <footer class="slds-modal__footer">
                            </footer>

                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </div>
        </template>
        <!-- <template lwc:else>
                <lightning-card >
                    <div class="slds-align_absolute-center slds-text-heading_small" style="height: 150px!important;">{error}</div>
                </lightning-card>
        </template> -->
    </template>
    <template lwc:else>

        <div style="height: fit-content; width: fit-content;">
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container slds-is-relative" style="width: 80%; max-width: 80%;">

                    <div class="slds-is-relative">
                        <template if:true={showSpinner}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>

                        <!-- Modal/Popup Box LWC header here -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                    size="small">
                                </lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                        </header>

                        <!-- Modal/Popup Box LWC body starts here -->
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-card>
                                <div class="slds-align_absolute-center slds-text-heading_small"
                                    style="height: 150px!important; text-align: center;">
                                    Error accessing the Account Plan Id.
                                    <br />
                                    Please refresh and try again!
                                    <br /><br />
                                    If the issue persistes please contact your System Administrator.
                                </div>
                                <!-- <div class="slds-align_absolute-center slds-text-heading_small"
                                style="height: 150px!important; text-align: center;"> 
                                If the issue persistes please contact your System Administrator.
                            </div> -->
                            </lightning-card>
                        </div>

                        <!-- Modal/Popup Box LWC footer starts here -->
                        <footer class="slds-modal__footer"> </footer>

                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>

    </template>

</template>
