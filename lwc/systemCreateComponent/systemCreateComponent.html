<template>
        <!-- Modal/Popup Box LWC starts here -->
        <div class="max-height">
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container slds-is-relative">
                <!-- Modal/Popup Box LWC header here -->
                <div class="slds-is-relative">
                    <template if:true={showSpinner}>
                        <lightning-spinner alternative-text="Loading" size="small" ></lightning-spinner>
                    </template>
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h3 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Create System</h3>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <lightning-record-edit-form
                    object-api-name=System__c
                    onsuccess={handleSuccess}
                    onerror={handleError}
                    onsubmit ={handleSubmit}
                >
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" >
                    <template if:true={showErrorMessage}>
                        <div class="slds-notify slds-notify_toast slds-theme_error slds-align_absolute-center" role="status">
                            <span class="slds-assistive-text">error</span>
                            <div class="slds-notify__content">
                              <h2 class="slds-text-heading_small ">Please Fill In Required Fields</h2>
                            </div>
                        </div>
                    </template>
                <lightning-messages></lightning-messages>
                <lightning-layout class="slds-p-top_medium">
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="Technology__c"></lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="Status__c" value="Live" disabled></lightning-input-field>
                    </lightning-layout-item>
                </lightning-layout>
                <!-- <lightning-layout>
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="System_URL__c" ></lightning-input-field>
                    </lightning-layout-item >
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="System_Type__c"></lightning-input-field>
                    </lightning-layout-item>
                </lightning-layout> -->
                <lightning-layout>
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="Technographic_Category__c" disabled value="HR"></lightning-input-field>
                    </lightning-layout-item >
                    <!-- <lightning-layout-item size="6">
                        <lightning-input-field field-name="Live_Date__c"></lightning-input-field>
                    </lightning-layout-item> -->
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="Sub_Category__c" ></lightning-input-field>
                    </lightning-layout-item>
                </lightning-layout>
                <!-- <lightning-layout>
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="Sub_Category__c" ></lightning-input-field>
                    </lightning-layout-item> -->
                    <!-- <lightning-layout-item size="6">
                        <lightning-input-field field-name="Technology__c"></lightning-input-field>
                    </lightning-layout-item> -->
                <!-- </lightning-layout> -->
                <lightning-layout>
                    <lightning-layout-item size="6">
                        <lightning-input-field field-name="Internal_System__c" value={isInternalSystem} disabled></lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" class="slds-m-top_xx-small slds-m-left_x-small">
                        <p style="font-size: x-small;">Record Type</p>
                        <p style="font-size: small;">Generic System</p>
                    </lightning-layout-item>
                </lightning-layout>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} type="Cancel" title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" type="submit" title="Save">Save</button>
                </footer>
                
            </lightning-record-edit-form>
            </div>
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </div>
</template>
