<template>
    <div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div id="box" class={boxClass} aria-expanded="true" aria-haspopup="listbox" role="combobox">
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                            role="none">
                            <template if:true={isValueSelected}>
                                <span class="slds-icon_container slds-combobox__input-entity-icon">
                                    <lightning-icon icon-name={iconName} size="x-small"
                                        alternative-text="icon"></lightning-icon>
                                </span>
                                <template if:true={isRequired}>
                                    <label lwc:if={label} class="slds-form-element__label" for="combobox-id-12"
                                        id="combobox-label-id-131">* {label}</label>
                                </template>
                                <template if:false={isRequired}>
                                    <label lwc:if={label} class="slds-form-element__label" for="combobox-id-12"
                                        id="combobox-label-id-132">{label}</label>
                                </template>
                                <input type="text" id="combobox-id-1" value={selectedName}
                                    class="slds-input_faux slds-combobox__input slds-combobox__input-value input-space"
                                    readonly disabled={isDisabled} /><!--style="width:140px" -->
                                <button lwc:if={hideCloseButton}
                                    class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                    title="Remove selected option">
                                    <lightning-icon lwc:if={label} icon-name="utility:close" size="x-small"
                                        alternative-text="close icon" onclick={handleRemovePill}></lightning-icon>
                                    <lightning-icon lwc:else icon-name="utility:close" size="x-small"
                                        alternative-text="close icon" onclick={handleRemovePillAura}
                                        data-id={indexVal}></lightning-icon>
                                </button>
                            </template>
                            <template if:false={isValueSelected}>
                                <div class="slds-p-top_none">

                                    <lightning-input lwc:if={label} class={inputClassFromParent} label={label}
                                        type="search" id="input" value={itemToSearch} onclick={handleClick}
                                        onblur={onBlur} onchange={onChange} autocomplete="off"
                                        placeholder={searchPlaceholder} required={isRequired}>
                                    </lightning-input>

                                    <lightning-input lwc:else class={inputClassFromParent} label={label} type="search"
                                        id={indexVal} data-id={indexVal} value={itemToSearch} onclick={handleClick}
                                        onblur={onBlur} onchange={onChange} autocomplete="off"
                                        placeholder={searchPlaceholder} required={isRequired} variant="label-hidden"
                                        disabled={isDisabled}>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>
                        <div id="listbox-id-1"
                            class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={records} for:item="record">
                                    <li lwc:if={label} key={record.Id} onclick={onSelect} data-id={record.Id}
                                        role="presentation" data-name={record.Name}>
                                        <span class="slds-lookup__item-action slds-lookup__item-action--label"
                                            role="option">
                                            <lightning-icon class="slds-icon slds-icon--small" icon-name={iconName}
                                                alternative-text={objectName} size="small"></lightning-icon>
                                            <span class="slds-truncate">{record.Name}</span>
                                        </span>
                                    </li>
                                    <li lwc:else key={record.Id} onclick={onSelectAura} data-id={record.Id}
                                        role="presentation" data-name={record.Name}>
                                        <span class="slds-lookup__item-action slds-lookup__item-action--label"
                                            role="option">
                                            <lightning-icon class="slds-icon slds-icon--small" icon-name={iconName}
                                                alternative-text={objectName} size="small"></lightning-icon>
                                            <span class="slds-truncate">
                                                <div class="lookup-data">
                                                    {record.Name}
                                                    <span class="account-name">{record.AccountName}</span>
                                                </div>
                                            </span>
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
