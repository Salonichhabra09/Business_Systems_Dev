<template>
    <template lwc:if={isShowSpinner}>
        <lightning-spinner alternative-text="Loading" size="large" style={contHierarchyHeight}></lightning-spinner>
    </template>
    <div lwc:if={isShowHierarchy} class="contHierarchy">
        <lightning-layout>
            <lightning-layout-item size="3">
                <div class="zoomBtns slds-no-print">
                    <!-- Zoom Out button -->
                    <lightning-button-icon icon-name="utility:zoomout" variant="border-filled" onclick={zoomOut}
                        alternative-text="Zoom Out" title="Zoom Out" disabled={isZoomDisabled}>
                    </lightning-button-icon>
                    <div class="slider"></div>

                    <!-- Slider for zoom level -->
                    <lightning-slider class="slider" max="100" min={minimum} step="1" value={zoomLevel}
                        onchange={handleZoom} disabled={isZoomDisabled}>
                    </lightning-slider>

                    <!-- Zoom In button -->
                    <lightning-button-icon icon-name="utility:zoomin" variant="border-filled" onclick={zoomIn}
                        alternative-text="Zoom In" title="Zoom In" disabled={isZoomDisabled}>
                    </lightning-button-icon>
                </div>
                <div class="slds-m-around_small">
                    <lightning-icon icon-name="utility:info" alternative-text="Helptext" title="Icon(s) Info"
                        size="small" onclick={handleLegendOpen} class={enlargeIcon}></lightning-icon>
                    <span style="font-weight: bold; font-style: italic;"> Icon(s) Info </span>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="6" class="slds-text-align_center account-url-layout">
                <a class="account-url" href={accountUrl} target="_blank">{accountName} <lightning-icon
                        class="slds-m-left_medium" icon-name="utility:new_window" size="small"></lightning-icon></a>
                <div class="hierarchy-name slds-m-top_x-small">
                    {hierarchyName}
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="3">
                <div class="slds-m-top_medium line-toggle">
                    <span style="font-weight: 500;"> Lines of Influence </span>
                    <lightning-input type="toggle" label="Lines of Influence" message-toggle-active=""
                        message-toggle-inactive="" variant="label-hidden" class="slds-m-left_medium influence-toggle"
                        onchange={handleInfluenceLines} checked={isInfluenceMode}>
                    </lightning-input>
                </div>
                <div class="slds-m-top_small line-toggle">
                    <span style="font-weight: 500;"> Lines of Conflict </span>
                    <lightning-input type="toggle" label="Lines of Conflict" message-toggle-active=""
                        message-toggle-inactive="" variant="label-hidden" class="slds-m-left_large"
                        onchange={handleConflictLines} checked={isConflictMode}>
                    </lightning-input>
                </div>
                <div class="slds-m-top_small line-toggle">
                    <span style="font-weight:500;"> Display info based on: </span>
                </div>
                <div class="slds-m-top_small line-toggle">
                    <lightning-combobox label="" variant="label-hidden" value={contactTitleToDisplay}
                        onchange={handleInputChange} options={contactTitleToDisplayOptions} style="width:10.5rem">
                    </lightning-combobox>
                </div>
            </lightning-layout-item>
        </lightning-layout>
        <div class="dragContainer">
            <!--<canvas lwc:ref="canvas" class="canvas"></canvas>-->
            <svg class={svgClass} style={contHierarchyHeight}>
                <template for:each={connections} for:item="conn">
                    <!-- Arrow Path -->
                    <!--<path key={conn.id} data-id={conn.id} d={conn.path} fill="none" stroke="lightgreen"
                        stroke-width="2"></path>-->
                    <path class="clickable-path" key={conn.id} data-id={conn.id} data-type="Influence" d={conn.path}
                        stroke="transparent" fill="none" stroke-width="10" pointer-events="stroke"
                        ondblclick={handleLineClick}></path>
                    <template for:each={conn.arrows} for:item="arrow">
                        <path key={arrow.key} d={arrow.d} fill="lightgreen" transform={arrow.transform}></path>
                    </template>
                </template>
                <template for:each={connectionsForConflictLines} for:item="conn">
                    <path key={conn.id} d={conn.path} fill="none" stroke="red" stroke-width="2"
                        stroke-dasharray="10,10"></path>
                    <path class="clickable-path" key={conn.id} data-id={conn.id} data-type="Conflict" d={conn.path}
                        stroke="transparent" fill="none" stroke-width="10" pointer-events="stroke"
                        ondblclick={handleLineClick}></path>
                </template>
            </svg>
            <lightning-layout>
                <lightning-layout-item size={hierarchySize}>
                    <template lwc:if={isShowContacts}>
                        <!-- Scrollable container for contact hierarchy -->
                        <div class="resize" onmousedown={mouseDownHandler} onmousemove={mouseMoveHandler}
                            onmouseup={mouseUpHandler}>
                            <ul class="map-class">
                                <!-- Iterate through contacts -->
                                <template for:each={contacts} for:item='cont'>
                                    <!-- Checks if the Contact Reporst to Id is null (it's a top level contact) -->
                                    <template lwc:if={cont.condition}>
                                        <!-- Contact card component for each contact -->
                                        <li key={cont.Id} data-id={cont.Id} class="level-2" draggable="true"
                                            ondragstart={handleDragStart} ondragover={handleDragOver}
                                            ondrop={handleDrop}>
                                            <c-acr_contact-card contact={cont} contacts={contacts} record-id={accountId}
                                                zoom-level={zoomLevel} onrefreshhierarchy={handleRefreshHierarchy}
                                                all-contacts-list={allContactsList}
                                                ontriggercontacthierarchyspinner={handleSpinnerToggle}
                                                total-placeholders={totalPlaceholders}
                                                hierarchy-information-id={recordId} onviewcontact={handleViewContact}
                                                onselectnode={handleSelectNode} onnewconnection={handleNewConnection}
                                                oninfluencemode={handleInfluenceMode}
                                                onconflictmode={handleConflictMode}
                                                contact-title-to-display={contactTitleToDisplay}>
                                            </c-acr_contact-card>
                                        </li>
                                    </template>
                                </template>
                            </ul>
                            <!-- </div> -->
                        </div>
                        <template if:true={isShowErrorMessage}>
                            <div class="slds-align_absolute-center slds-text-heading_small"
                                style="height: 150px!important; text-align: center; padding-left:240px;">
                                <lightning-formatted-text value={errorGettingContacts}></lightning-formatted-text>
                            </div>
                        </template>
                    </template>
                </lightning-layout-item>
                <lightning-layout-item lwc:if={isAction} size="3" class="action-space slds-is-relative">
                    <lightning-button-icon icon-name="utility:close" variant="container" onclick={handleActionClose}
                        class="action-close-icon"></lightning-button-icon>
                    <div lwc:if={isView} class="slds-m-vertical_x-large slds-m-horizontal_medium">
                        <c-acr_contact-view-card contact={contact} active-tab={activeTabInViewCard}
                            onrefreshhierarchy={handleRefreshHierarchy}
                            oncloseaction={handleActionClose}></c-acr_contact-view-card>
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </div>
    </div>
    <!-- Display error message if no contacts available -->
    <div lwc:if={isShowErrorMessage}>
        <lightning-card>
            <div class="slds-align_absolute-center slds-text-heading_small"
                style="height: 150px!important; text-align: center;">
                <lightning-formatted-text value={errorGettingContacts}></lightning-formatted-text>
            </div>
        </lightning-card>
    </div>
    <template lwc:if={isLegendPopUpOpen}>
        <div style={modalresize}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <!-- Close button -->
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseLegendsPopUp}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Cancel and close</span>
                    </button>
                    <div class="slds-modal__header">
                        <!-- Modal title -->
                        <h1 id="modal-heading-03" class="slds-modal__title slds-hyphenate">Icon(s) Info
                        </h1>
                    </div>
                    <div class="slds-modal__content slds-p-around_small" id="modal-content-id-3">
                        <div class="slds-align_absolute-center">
                            <div class="legend-container">
                                <!-- Left Column: Icons -->
                                <div class="legend-column">
                                    <div class="slds-grid slds-wrap slds-gutters">
                                        <template for:each={legends} for:item="legend">
                                            <div key={legend.label}
                                                class="legend-item slds-p-around_x-small slds-col slds-size_1-of-2">
                                                <lightning-icon icon-name={legend.iconName} size={legend.size}
                                                    class={legend.iconClass}></lightning-icon>
                                                <span class="legend-label">{legend.label}</span>
                                            </div>
                                        </template>
                                        <div class="legend-item slds-p-around_x-small slds-col slds-size_1-of-2">
                                            <img src={linkedToOpenAndClosedWonOpportunityIcon}
                                                alt="Linked to Open and Closed Won Opportunity" tabindex="0"
                                                title="Linked to Open and Closed Won Opportunity" class="reduce-size" />
                                            <span class="legend-label">Linked to Open and Closed Won Opportunity</span>
                                        </div>
                                    </div>
                                </div>
                                <!-- Right Column: Color Legends -->
                                <div class="legend-column">
                                    <div class="slds-grid slds-wrap slds-gutters">
                                        <div class="slds-col slds-size_1-of-2">
                                            <div class="activeContacts legend-item slds-p-around_x-small">
                                                Active Contacts
                                            </div>
                                            <div class="notActiveContacts legend-item slds-p-around_x-small ">
                                                Inactive Contacts
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="slds-modal__footer">
                        <!-- Cancel and Save buttons -->
                        <button class="slds-button slds-button_neutral" aria-label="Cancel and close"
                            onclick={handleCloseLegendsPopUp}>Close</button>
                    </div>
                </div>
            </section>
            <!-- Modal backdrop -->
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </div>
    </template>

    <template lwc:if={isDeleteLinePopup}>
        <div style={modalresize}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container slds-is-relative">

                    <div class="slds-is-relative">
                        <template lwc:if={isShowSpinner}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>

                        <div class="slds-modal__header">
                            <!-- Close button -->
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleDeleteLinePopupClose}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                    size="small">
                                </lightning-icon>
                                <span class="slds-assistive-text">Cancel and close</span>
                            </button>
                            <!-- Modal title -->
                            <h1 id="modal-heading-04" class="slds-modal__title slds-hyphenate">{lineDeletePopupTitle}
                            </h1>
                        </div>
                        <div class="slds-modal__content slds-p-around_small" id="modal-content-id-4">
                            <p class="delete-message slds-align_absolute-center">Are you sure you want to delete the
                                line?</p>

                        </div>
                        <div class="slds-modal__footer">
                            <!-- Cancel and Save buttons -->
                            <button class="slds-button slds-button_neutral" onclick={handleDeleteLinePopupClose}
                                type="Cancel" title="Cancel">Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={handleDeleteLine} type="submit"
                                title="Delete">Delete</button>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Modal backdrop -->
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </div>
    </template>

</template>
