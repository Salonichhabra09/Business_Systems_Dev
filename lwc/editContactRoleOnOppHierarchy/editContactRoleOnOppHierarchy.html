<template>
    <div style={modalresize}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container slds-is-relative">
                <!--<div class="slds-is-relative">
                    <template lwc:if={showSpinner}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                </div>-->
                <!-- Close button -->
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={handleCancelOnEditContactRole}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="medium">
                    </lightning-icon>
                    <span class="slds-assistive-text">Cancel and close</span>
                </button>
                <div class="slds-modal__header">
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Edit Contact Role
                    </h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-is-relative">
                        <template lwc:if={showSpinner}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>
                    </div>
                    <div class="slds-p-around_small" onclick={closeEditOnBlur}>
                        <template lwc:if={isEdit}>
                            <c-multi-select-combobox-hierarchy label="Options" name="options"
                                options={contactRoleOptions} onchange={handleInputRole} onclose={handleClose}
                                pre-selected-options={updatedSelectedRoles}></c-multi-select-combobox-hierarchy>
                        </template>
                        <template lwc:else>
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_10-of-12">
                                    <p style="text-wrap: auto;">{updatedSelectedRoles}</p>
                                </div>
                                <div class="slds-col slds-size_2-of-12">
                                    <lightning-icon icon-name="utility:edit" size="xx-small"
                                        onclick={handleEdit}></lightning-icon>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" aria-label="Cancel and close"
                        onclick={handleCancelOnEditContactRole}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={handleSaveOnEditContactRole}
                        disabled={showSubmit}>Save</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </div>
</template>
