<template>
    <div style="background-color:#ccd1d2;">
        <div class="slds-page-header slds-page-header_record-home">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <span class="slds-page-header__title slds-truncate">You are generating {value} form for Job <lightning-formatted-url value={recordUrl} label={jobNumber}></lightning-formatted-url></span>
                    <div class="slds-media">
                        <div class="slds-media__figure">
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button label="Next" onclick={handlenext}></lightning-button>
                        </div> 
                    </div>
                </div>
            </div>
        </div>
        <lightning-card>
            <template if:true={SystemUsedPicklistValues.data}>
                <div class="slds-grid" style="height:15rem">
                    <div class="slds-col slds-size_3-of-12"></div>
                    <div class="slds-col slds-size_6-of-12">
                <lightning-combobox name="System"
                                    label="Select Form Category"
                                    value={value}
                                    placeholder="-Select-"
                                    options={SystemUsedPicklistValues.data.values}
                                    onchange={handleChange} >
                </lightning-combobox>
                <br>
                <template if:true={showSolutions}>
                <lightning-combobox name="Solution"
                label="Select Solution"
                value={valueSolution}
                placeholder="-Select-"
                options={solutionOptions}
                onchange={handleChangeSolution} >
</lightning-combobox>
</template>
                <div style="padding-top:3px;padding-left: 3px;" if:true={errorMessage} class="slds-text-color_error">{errorMessage}</div>
            </div>
            <div class="slds-col slds-size_3-of-12"></div>
        </div>
                
          </template>

          </lightning-card>
    </div>
   
</template>
