<template>
    <lightning-card title="Please upload a new image if you wish to change the current banner on the Client Dashboard" icon-name="utility:image">
        
        <!-- Informative Points -->
        <div class="slds-box slds-theme_shade slds-m-around_medium">
            <p><strong>✔ Accepted Image Format:</strong> .png, .jpg, .jpeg, .svg</p>
            <p><strong>✔ Accepted Image Size:</strong> 1310 x 190 pixels</p>
            <p><strong>✔ If you do not upload the banner, the default banner will apply.</strong></p>
        </div>

        <div class="slds-p-around_medium">
            <!-- Image Preview Section -->
            <div class="slds-m-bottom_medium">
                <template if:true={imageUrl}>
                    <p><strong>Current Banner:</strong></p>
                    <div class="image-container">
                        <img src={imageUrl} alt="Current Banner" class="banner-image"/>
                    </div>
                </template>

                <template if:true={newImageUrl}>
                    <p><strong>New Banner Preview:</strong></p>
                    <div class="image-container">
                        <img src={newImageUrl} alt="New Banner" class="banner-image"/>
                    </div>
                </template>
            </div>

            <!-- File Upload Section -->
            <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                <div class="slds-align_absolute-center">
                    <lightning-icon icon-name="utility:upload" size="small" class="slds-m-right_small"></lightning-icon>
                    <input type="file" accept=".png,.jpg,.jpeg,.svg" class="file-input" onchange={handleFileChange} />
                </div>

                <!-- Submit Button -->
                <template if:true={showUploadButton}>
                    <lightning-button 
                        label="Submit" 
                        variant="brand" 
                        onclick={uploadImage}>
                    </lightning-button>
                </template>
            </div>

            <!-- Show Spinner When Upload is in Progress -->
            <template if:true={isUploading}>
                <lightning-spinner alternative-text="Uploading..." size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
