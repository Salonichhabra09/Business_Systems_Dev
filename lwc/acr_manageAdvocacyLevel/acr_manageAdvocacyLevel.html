<template>
    <div class="dropdown-container">
        <!-- Icon trigger -->
        <template lwc:if={iconNameToDisplay}>
            <lightning-icon icon-name={iconNameToDisplay} onclick={handleManageAdvocacyLevel} title={advocacyLevel}
                class={toggleColor} data-id="myDiv" size={iconSize} onblur={handleDropDownClose} tabindex="0">
            </lightning-icon>
        </template>
        <template lwc:else>
            <img src={weakIcon} alt={advocacyLevel} class={toggleColor} tabindex="0" onclick={handleManageAdvocacyLevel}
                title={advocacyLevel} onblur={handleDropDownClose} />
        </template>

        <!-- Listbox -->
        <div if:true={isDropdownOpen} class="dropdown-listbox">
            <ul>
                <template for:each={advocacyLevelOptions} for:item="option">
                    <li key={option.label} data-value={option.label} onclick={handleOptionClick} tabindex="0">
                        <span class="option-label">{option.label}</span>
                        <template lwc:if={option.icon}>
                            <lightning-icon icon-name={option.icon} alternative-text={option.label}
                                class={option.lisIconsCss} size="xx-small">
                            </lightning-icon>
                        </template>
                        <template lwc:else>
                            <img src={weakIcon} alt={option.label} class={option.lisIconsCss} />
                        </template>
                    </li>
                </template>
            </ul>
        </div>
    </div>

</template>
