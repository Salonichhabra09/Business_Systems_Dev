<template>
    <br>
    <lightning-file-upload 
        name="fileUploader"
        accept={acceptedFormats}
        record-id={recordId}
        onuploadfinished={handleUploadFinished}>
    </lightning-file-upload>
    <template if:false={newFileWasUploaded}>
        <img src={AccountLogo}/>
    </template>
    <template if:true={newFileWasUploaded}>
        <template for:each={uploadedFilesUrl} for:item="file">
            <div key={file.id}>
                <img src={file.id}/>
            </div>
        </template>  
     </template>
     <br>
    

      
  </template>
