<template>
    <lightning-card title="Send Existing Password" icon-name="utility:email">
        <div class="slds-p-around_medium">
            <lightning-input 
            type="text" 
            label="Add Email" 
            value={newEmail} 
            onchange={handleEmailChange} 
            class={emailInputClass}
            data-email>
        </lightning-input>
        <template if:true={showEmailError}>
            <div class="slds-text-color_error slds-m-top_x-small">Please enter a valid email address</div>
        </template>
        <br>
        <lightning-button label="Add" variant="brand" class="slds-m-top_small" onclick={addEmail}></lightning-button>

            <template if:true={emailList.length}>
                <div class="slds-m-top_medium">
                    <lightning-datatable
                        key-field="id"
                        data={emailListFormatted}
                        columns={columns}
                        hide-checkbox-column
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>

            <div class="slds-m-top_large slds-text-align_center">
                <lightning-spinner if:true={isLoading} alternative-text="Processing..."></lightning-spinner>
                <lightning-button label="Send Existing Password" variant="brand" onclick={sendExistingPassword}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
