<template>
    <lightning-card title="Password Manager" icon-name="utility:key">
        <div class="slds-p-around_medium">
            <lightning-button label="Generate New Password and Send" 
                              variant="brand" 
                              class="slds-m-right_small" 
                              onclick={handleGenerateNewPassword}>
            </lightning-button>

            <lightning-button label="Send Existing Password" 
                              variant="neutral" 
                              onclick={handleSendExistingPassword}>
            </lightning-button>
        </div>

        <!-- Dynamically renders selected component -->
        <template if:true={showJobEmailManager}>
            <c-job-email-manager record-id={recordId} oncloseparent={handleClose}></c-job-email-manager>
        </template>

        <template if:true={showSendExistingPassword}>
            <c-send-existing-password record-id={recordId} oncloseparent={handleClose}></c-send-existing-password>
        </template>
    </lightning-card>
</template>
