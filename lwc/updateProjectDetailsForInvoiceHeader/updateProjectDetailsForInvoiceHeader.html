<template>
    
    <template if:true= {showRadioButtons}> 
       
    <lightning-card title={showTitle}>
       
            <template if:true={isProjectCancelled}>
                <div style="margin-left:12px;margin-right:5px;color:rgb(234,0,34)">
                <div class="slds-align_absolute-center slds-text-heading_small" >
                <lightning-formatted-text value="Warning: Please ensure that you select a relevant project as the currently selected project is cancelled."></lightning-formatted-text>
            </div></div>
            </template>
            <template if:true={showAddProjectWarning}>
                <div style="margin-left:12px;margin-right:5px;color:rgb(234,0,34)">
                <div class="slds-align_absolute-center slds-text-heading_small" >
                <lightning-formatted-text value="Warning: No project has been selected, please select a relevant project."></lightning-formatted-text>
            </div></div>
            </template>
            <div style="margin-left:5px;margin-right:5px;margin-top:15px;">
         <div class="slds-border_left slds-border_right slds-border_top slds-border_bottom max-height">
            <lightning-datatable
                    key-field="projectId"
                    data={recordsToDisplay}
                    columns={columnsToUse}
                    wrap-text-max-lines="5"
                    min-column-width="100"
                    max-row-selection="1"
                    onrowselection={handleRowSelection}
                    selected-rows={preSelectedRows}
                   >
                </lightning-datatable>
                                    </div>
        
            <br/>
            <template if:true={showUpdateProjectError}>
                <div class="slds-align_absolute-center slds-text-heading_small"
           >
            <lightning-formatted-text value={updateProjectError}></lightning-formatted-text>
        </div>
            </template>
            <div>
                <lightning-button      variant="brand" type="submit" label="Update Project" 
                 disabled={isDisabled} onclick={updateProjectNumber}>
                </lightning-button>
            </div>
        </div>

    </lightning-card>

</template>
  
<template if:true={showSpinner}>
   
    <lightning-card>
    <div class="slds-align_absolute-center" style="position: relative; ">
        <div style='margin-top:10px;margin-bottom:10px'></div>
        <lightning-spinner class="slds-spinner_inline" alternative-text="Updating..." size="small" ></lightning-spinner>
    </div>
    </lightning-card>
  
</template>
<template if:true ={showError}>
   
    <lightning-card>
        <div class="slds-align_absolute-center slds-text-heading_small"
            style="height: 150px!important; text-align: center;">
            <lightning-formatted-text value={ErrorMessage}></lightning-formatted-text>
        </div>
    </lightning-card>
    

</template>

<template if:true ={showCancelledWarningMessage}>
   
    <lightning-card title="Add Project Number to Invoice">
        <div style="margin-left:12px;margin-right:5px;">
            <div class=" slds-text-heading_small" style="color:rgb(234,0,34)">
            <lightning-formatted-text value="Warning: Please ensure that you select a relevant project as the currently selected project is cancelled."></lightning-formatted-text>
        </div></div>
    </lightning-card>

</template>
</template>
