<template>
    <template if:true={showConfirmation}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseDialog}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Confirm File Upload</h2>
                    </header>
    
                    <!-- Modal/Popup Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>You are uploading less number of Candidates than the permissible limit. For catering the remaining candidates you will have to submit new request.</p>
                        <p> Do you want to continue?</p>
                    </div>
    
                    <!-- Modal/Popup Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={handleCloseDialog}></lightning-button>
                        <lightning-button variant="Success" label="Confirm" onclick={handleConfirmDelete}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    
    <template if:true={showUI}>
        <div class="slds-notify slds-notify_alert slds-theme_info">
            <span class="slds-assistive-text">info</span>
            <template if:true={limitReached}>
            <span>Candidate Limit has been reached. Please split the file containing {remainingLimit} remaining Candidates and create a new opp/job for extra usage of {extraUsage}.</span>
            </template>
            <template if:false={limitReached}>
                <span>Please Upload the file containing remaining Candidates.</span>
            </template>
        </div>
        <form>
            <fieldset class="slds-box slds-theme_default fieldSetBorder">
                <div class="slds-align_absolute-center slds-var-m-vertical_medium">
                    <lightning-file-upload label="Attach Candidate File" name="fileUploader" accept={acceptedFormats}
                        record-id={recordId} onuploadfinished={handleUploadFinished} disabled={disableInput}>
                    </lightning-file-upload>
                </div>
                <div class="slds-align_absolute-center slds-var-m-vertical_medium">
                    Please ensure the CSV encoding is UTF-8 before upload or use the template below.
                </div>
                <div lwc:if={showErrorMessage} class="slds-align_absolute-center" style="color:red">
                    Error Occurred: {errorMessage}
                </div>
                <div lwc:if={showFileName} class="slds-align_absolute-center" style="color:green">
                    File Uploaded: {documentName}
                </div>
            </fieldset>
        </form>
    </template>
    
</template>
