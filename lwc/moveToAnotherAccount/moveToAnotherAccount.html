<template>
    <div class="slds-is-relative">
        <lightning-quick-action-panel header={header}>
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template if:true={showMessage}>
                <div class="slds-p-around_medium">
                    <h2 class="slds-text-heading--medium">This button should not be used to create new contacts. Before
                        saving your changes, please make sure you update the Account and E-mail Address. Check the
                        qualifications are showing on the new record.</h2>
                </div>
            </template>
            <template if:true={showContactForm}>
                <lightning-record-edit-form object-api-name="Contact" onsuccess={handleSuccess} onerror={handleError}>
                    <template if:true={showErrorMessage}>
                        <div class="slds-notify slds-notify_toast slds-theme_error slds-align_absolute-center"
                            role="status" data-id="error-message">
                            <span class="slds-assistive-text">error</span>
                            <div class="slds-notify__content">
                                <h2 class="slds-text-heading_small ">Please Resolve Errors</h2>
                                <p>{errorMessage}</p>
                            </div>
                        </div>
                    </template>
                    <lightning-messages></lightning-messages>
                    <div class="slds-p-around_medium" style="max-height: 390px;">
                        <div class="slds-float_right">* = Required Information</div>

                                    <lightning-layout-item size="3">
                                        <p style="font-weight: bold;font-size:12px">*Name</p>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="9">
                                        <lightning-input-field field-name="Salutation"
                                            value={contact.fields.Salutation.value} variant="label-stacked"
                                            style="margin-left: 1.89rem;padding-right:2.15rem;"></lightning-input-field>
                                    </lightning-layout-item>
                                </lightning-layout>
                                <lightning-layout>
                                    <lightning-input-field field-name="FirstName" value={contact.fields.FirstName.value}
                                        variant="label-stacked" style="padding-left: 8.8rem;"></lightning-input-field>
                                </lightning-layout>
                                <lightning-layout>
                                    <lightning-input-field field-name="LastName" value={contact.fields.LastName.value}
                                        class="required-fields" variant="label-stacked"
                                        style="padding-left: 8.8rem;"></lightning-input-field>
                                </lightning-layout>
                            </lightning-layout-item>

                                    value={contact.fields.Contact_Status__c.value}

                            <lightning-layout-item size="6">

                                    value={contact.fields.Independent_Consultant__c.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                        <h3 class="slds-section-title--divider slds-m-top_medium">Additional Information</h3>
                        <lightning-layout class="slds-m-top_small slds-p-right_small">
                            <lightning-layout-item size="6">
                                <lightning-input-field field-name="Description" value={contact.fields.Description.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                            <lightning-layout-item size="6">
                                <lightning-input-field field-name="AdditionalContactNotes__c"
                                    value={contact.fields.AdditionalContactNotes__c.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout class="slds-m-top_x-small slds-p-right_small">
                            <lightning-layout-item size="6">
                                <template if:true={isGcscGeneral}>
                                    <lightning-input-field field-name="Eloqua_Lead_Rating__c"
                                        value={contact.fields.Eloqua_Lead_Rating__c.value}
                                        class="slds-m-left_medium"></lightning-input-field>
                                </template>
                            </lightning-layout-item>
                            <lightning-layout-item size="6">
                                <lightning-input-field field-name="LegacyRegistrationNumber__c"
                                    value={contact.fields.LegacyRegistrationNumber__c.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout class="slds-m-top_x-small slds-p-right_small">
                            <lightning-layout-item size="6">
                                <!-- <lightning-output-field field-name="OwnerId" class="slds-m-left_medium"></lightning-input-field> -->
                            </lightning-layout-item>
                            <lightning-layout-item size="6">
                                <lightning-input-field field-name="Contact_Priority__c"
                                    value={contact.fields.Contact_Priority__c.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout class="slds-m-top_x-small slds-p-right_small">
                            <lightning-layout-item size="6">
                                <lightning-input-field field-name="AM_SFDC_Contact_Record_ID__c"
                                    value={contact.fields.AM_SFDC_Contact_Record_ID__c.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                            <lightning-layout-item size="6">
                                <lightning-input-field field-name="AM_Contact__c"
                                    value={contact.fields.AM_Contact__c.value}
                                    class="slds-m-left_medium"></lightning-input-field>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </lightning-record-edit-form>

            </template>
            <template if:true={showCreatedContactInfo}>
                <lightning-layout class="slds-m-top_small slds-p-horizontal_small">
                    <lightning-layout-item size="6">
                        <h3 class="slds-section-title--divider">Contact marked as Left Institution</h3>
                        <template lwc:if={errorInFlow}>
                            <p class="slds-m-top_medium slds-m-left_x-small" style="color: red;">An error occurred while
                                marking the old contact as Left Institution.Please contact System Administrator</p>
                        </template>
                        <template lwc:else>
                            <p class="slds-m-top_medium slds-m-left_x-small">Contact Name : <a data-id={oldContactId}
                                    onclick={handleNavigateToContact}>{oldContactName}</a></p>
                            <p class="slds-m-top_small slds-m-left_x-small">Email : {oldContactEmail}</p>
                            <p class="slds-m-top_small slds-m-left_x-small">Account : {oldContactAccount}</p>
                        </template>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" class="slds-m-left_small">
                        <h3 class="slds-section-title--divider">New Contact Details</h3>
                        <p class="slds-m-top_medium slds-m-left_x-small">Contact Name : <a data-id={newContactId}
                                onclick={handleNavigateToContact}>{newContactName}</a></p>
                        <p class="slds-m-top_small slds-m-left_x-small">Email : {newContactEmail}</p>
                        <p class="slds-m-top_small slds-m-left_x-small">Account : {newContactAccount}</p>
                    </lightning-layout-item>
                </lightning-layout>

            </template>
            <div slot="footer">
                <template if:true={showMessage}>
                    <lightning-button variant="brand" onclick={openContactForm} label="OK"></lightning-button>
                </template>
                <template if:true={showContactForm}>
                    <button class="slds-button slds-button_neutral" onclick={closeModal} type="Cancel"
                        title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" type="submit" title="Save"
                        onclick={handleSave}>Save</button>
                </template>
                <template if:true={showCreatedContactInfo}>
                    <lightning-button variant="brand" onclick={handleFinish} label="Finish"></lightning-button>
                </template>
            </div>
        </lightning-quick-action-panel>
    </div>
    <template if:true={renderFlow}>
        <lightning-flow flow-api-name="Move_to_Another_Account_Old_Contact" flow-input-variables={inputVariables}
            onstatuschange={handleStatusChange}>
        </lightning-flow>
    </template>
</template>
