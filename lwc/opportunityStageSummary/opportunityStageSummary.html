<template>
    <!-- Global/initial load overlay spinner -->
    <template lwc:if={showSpinner}>
        <div class="slds-is-absolute slds-align_absolute-center" style="inset: 0; background: rgba(255,255,255,0.5); z-index: 1;">
            <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
        </div>
    </template>

    <template lwc:if={hasData}>
        <lightning-card title="Opportunity Stage Summary" icon-name="standard:opportunity" class={cardContainerClass}>
            <template lwc:if={chartConfiguration}>
                <template lwc:if={chartData}>
                    <!--<lightning-icon icon-name="utility:info" alternative-text="Info" size="xx-small" class="slds-m-horizontal_small slds-m-bottom_small"></lightning-icon>Stages lasting over 5 days appear in red-->
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered custom-table" 
                    aria-labelledby="element-with-table-label other-element-with-table-label">
                        <thead>
                            <tr>
                                <th style="width:50%">Stage</th>
                                <th style="text-align:center; width:50%">Days</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={processedData} for:item="row">
                                <tr key={row.stage}>
                                    <td style="width:50%">{row.stage}</td>
                                    <td style="text-align:center; width:50%">{row.days}</td>
                                </tr>
                            </template>
                        </tbody>
                </table>
                </template>
                <template lwc:else>
                    <p class="slds-align_absolute-center slds-m-vertical_medium">
                            No Opportunity data available or you do not have access.
                        </p>
                </template>
            </template>
            <template lwc:else>
                <div class="slds-p-horizontal_medium slds-p-top_medium">
                    <div class="slds-m-bottom_small">*Select a Close Date range to view records</div>
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-p-bottom_small">
                        <lightning-combobox
                            name="status"
                            label="Status"
                            placeholder="All"
                            value={selectedStatus}
                            options={statusOptions}
                            onchange={handleStatusChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-p-bottom_small">
                        <lightning-combobox
                            name="oppType"
                            label="Opportunity Type"
                            placeholder="All Types"
                            value={selectedType}
                            options={opportunityTypeOptions}
                            onchange={handleTypeChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-p-bottom_small">
                        <lightning-input
                            type="date"
                            name="startDate"
                            label="Start Date"
                            value={startDate}
                            onchange={handleStartDateChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-p-bottom_small">
                        <lightning-input
                            type="date"
                            name="endDate"
                            label="End Date"
                            value={endDate}
                            onchange={handleEndDateChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12 slds-p-bottom_small slds-m-top_large">
                        <lightning-button
                            variant="brand"
                            label="Apply"
                            title="Apply Filters"
                            onclick={handleApply}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            variant="neutral"
                            label="Reset"
                            title="Reset Filters"
                            onclick={handleReset}>
                        </lightning-button>
                    </div>
                </div>
                <div class="slds-m-bottom_small slds-align_absolute-center">
                    <template lwc:if={dateError}>
                        <div class="slds-text-color_error slds-m-top_x-small">{dateError}</div>
                    </template>
                </div>
            </div>
            <!--<lightning-icon icon-name="utility:info" alternative-text="Info" size="xx-small" class="slds-m-horizontal_small slds-m-bottom_small"></lightning-icon>Stages lasting over 5 days appear in red-->
            <div style="height: 300px; position: relative;" class="slds-border_left slds-border_right slds-border_top slds-border_bottom">
                <lightning-datatable
                    key-field="id"
                    data={opportunitySummary}
                    columns={columns}
                    wrap-text-max-lines="5"
                    show-row-number-column
                    hide-checkbox-column
                    is-loading={isTableLoading}
                    enable-infinite-loading={hasMore}
                    load-more-offset="2"
                    onloadmore={handleLoadMore}
                    row-class={computeRowClass}
                >
                </lightning-datatable>
                <template lwc:if={isTableLoading}>
                    <div class="slds-is-absolute slds-align_absolute-center" style="inset: 0; background: rgba(255,255,255,0.5);">
                        <lightning-spinner alternative-text="Loading more" size="small" variant="brand"></lightning-spinner>
                    </div>
                </template>
            </div>
            <div class="slds-align_absolute-center slds-var-m-vertical_medium slds-text-body_small slds-text-color_weak">
                {loadMoreStatus}
            </div>
            </template>
            
        </lightning-card>
    </template>
    <template lwc:else>
        <lightning-card title="Opportunity Stage Summary" icon-name="standard:opportunity">
            <p class="slds-align_absolute-center slds-m-vertical_medium">
                No Opportunity data available or you do not have access.
            </p>
        </lightning-card>
    </template>
</template>
