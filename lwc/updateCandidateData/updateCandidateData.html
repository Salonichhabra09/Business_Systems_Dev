<template>
    <form>
        <template if:true={showLoadingSpinner}>
            <div style="z-index: 10000 !important;">
                <lightning-spinner alternative-text="Loading..." size="medium" style="z-index: 10000 !important;">
                </lightning-spinner>
            </div>
        </template>
        <fieldset class="slds-box slds-theme_default fieldSetBorder">
            <legend id="reg2" class="slds-text-heading_small slds-var-p-vertical_medium bold-legend">
                Upload CSV File
            </legend>
            <label></label>
            <div class="slds-grid slds-grid_vertical slds-box slds-theme_warning" style="outline-style: solid;">
                <div class="slds-col">
                    <b>Important Information - Before uploading the candidates:</b>
                </div>
                <div class="slds-col slds-var-m-left_medium">
                    <ul style="list-style-type:disc">
                        <li>Please ensure that there are no invalid character in your upload file like: !@#$%^&amp;*()+={}[]|\:;&quot;&lt;&gt;?/.&copy;</li>
                        <li>Email Address column should have values as per universally accepted format.</li>
                        <li>There should not be any extra blank spaces before or after any text.</li>
                    </ul>
                </div>
            </div>
            <div class="slds-align_absolute-center slds-var-m-vertical_medium">
                <lightning-file-upload label="Attach Candidate File" name="fileUploader" accept={acceptedFormats}
                        record-id={recordId} onuploadfinished={handleUploadFinished}>
                    </lightning-file-upload>
            </div>
        </fieldset>
    </form>
</template>
