<template>
    <lightning-quick-action-panel header="Create Tasks" class="modalPopup">
        <div class="slds-is-relative">
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Loading" size="small" ></lightning-spinner>
        </template>
        <template if:true={showErrorMessage}>
            <div class="slds-notify slds-notify_toast slds-theme_error slds-align_absolute-center" role="status">
                <span class="slds-assistive-text">error</span>
                <div class="slds-notify__content">
                  <h2 class="slds-text-heading_small ">Please fill in required details : Assigned To and Status</h2>
                </div>
            </div>
        </template>
        <lightning-card>
            <lightning-button slot="actions" label="Add Row" onclick={addRow}></lightning-button>
        <div class="slds-grid slds-wrap slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-9 slds-p-right_large slds-p-left_small">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">#</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large slds-p-left_small">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Subject</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Due Date</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Name</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Related To</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Assigned To *</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Status *</div>
                    </th>
                </table>
            </div>
            <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                <table>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Name">Comments</div>
                    </th>
                </table>
            </div>
        </div>
        <template for:each={taskList} for:item="task" for:index="index">
            <lightning-record-edit-form key={task.id} object-api-name={objectApiName}>
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-9 slds-p-right_large slds-p-left_small">
                        <p>{task.id}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-8 slds-p-right_large slds-p-left_small">
                        <!-- <lightning-combobox name="Industry" label="Industry" value={task.subject} accesskey={task.id}
                            options={subjectPicklist} onchange={selectSubject} variant="label-hidden">
                        </lightning-combobox> -->
                        <template if:true={isLoaded}>
                            <c-custom-search-component onlookupselected={handleSubjectValue} picklist={subjectPicklist}
                            onlookupunselect={handleSubjectValueRemoval}
                            oncustomvalueselected={handleSubjectValue} 
                            access-key={task.id}
                            input-class-from-parent="slds-has-focus input-contact"
                            subject-from-parent={task.subject}> 
                        </c-custom-search-component>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                        <lightning-input type="Date" variant="label-hidden" onchange={selectDate} value={task.dueDate} accesskey={task.id}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                        <template if:true={isLoaded}>
                            <lightning-input-field field-name="Key_Contact_Sponsor__c" accesskey={task.id} value={task.contact} variant="label-hidden" onchange={selectContact}>
                            </lightning-input-field>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                        <lightning-input-field field-name="Strategy__c" variant="label-hidden" accesskey={task.id} value={recordId} disabled="true">
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                        <template if:true={isLoaded}>
                            <lightning-input-field field-name="Owner__c" variant="label-hidden" onchange={selectUser} value={task.assignedTo} accesskey={task.id} class="required-fields">
                            </lightning-input-field>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                        <lightning-combobox name="Industry" label="Industry" value={task.status}
                            options={statusPicklist} onchange={selectStatus} variant="label-hidden" accesskey={task.id} class="required-fields">
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-6 slds-p-right_large">
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_11-of-12">
                                <template if:true={isLoaded}>
                                    <lightning-textarea name="input1" label="Enter some text" variant="label-hidden" value={task.comments} onblur={selectComments} accesskey={task.id}></lightning-textarea>
                                </template>
                            </div>
                            <div class="slds-col slds-size_1-of-12 slds-p-left_medium">
                            <lightning-button-icon icon-name="utility:delete" accesskey={task.id} variant="bare" onclick={removeRow} size="large"></lightning-button-icon>
                        </div>
                          </div>
                    </div>
                    <!-- <div class="slds-col slds-size_1-of-8 slds-p-right_large">
                        <lightning-button-icon icon-name="utility:delete" accesskey={task.id} variant="bare" onclick={removeRow} size="large"></lightning-button-icon>
                </div> -->
            </div>
            </lightning-record-edit-form>
        </template>
    </lightning-card>
    <footer class="slds-float_right slds-p-top_x-large slds-p-bottom_small">
        <button class="slds-button slds-button_neutral" onclick={closeModal} type="Cancel" title="Cancel">Cancel</button>
        <button class="slds-button slds-button_brand" type="submit" title="Save" onclick={handleSave} disabled={showSpinner}>Save</button>
    </footer>
</div>
</lightning-quick-action-panel>
</template>
