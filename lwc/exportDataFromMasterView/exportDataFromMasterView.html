<template>
    <template if:true={showLoadingSpinner}>
        <div style="z-index: 10000 !important;">
            <lightning-spinner alternative-text="Hello" size="medium" class="spins" style="z-index: 10000 !important;">
            </lightning-spinner>
        </div>
    </template>
    <div if:true={showButton} class="slds-m-around_small">
        <lightning-button class="slds-m-right_small" label="Master View" onclick={handleMasterView} variant="brand"
            icon-name="utility:download">
        </lightning-button>
        <lightning-button class="slds-m-right_small" label="Candidate Data" onclick={handleExportCandidate}
            variant="brand" icon-name="utility:download">
        </lightning-button>
        <lightning-button class="slds-m-right_small" label="Platform Data" onclick={handleExportPlatformData}
            variant="brand" icon-name="utility:download">
        </lightning-button>
    </div>
</template>
