name: Salesforce Apex Code Review

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'force-app/**/*.cls'
      - 'force-app/**/*.trigger'
  pull_request_review_comment:
    types: [ created ]

permissions:
  contents: read
  pull-requests: write

jobs:
  apex-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get changed Apex files
        id: changed-files
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
                    | grep -E "\.(cls|trigger)$" | head -20)
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED"

      - name: Run Claude Code Review
        if: steps.changed-files.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          REVIEW_OUTPUT=$(claude -p \
            "Review the following changed Apex files: ${{ steps.changed-files.outputs.files }}
             Follow the standards in CLAUDE.md exactly.
             Structure output as: BLOCKERS / WARNINGS / SUGGESTIONS / SUMMARY TABLE.
             Be specific: quote the file name and line issue for every finding.
             End with overall verdict: APPROVED or CHANGES REQUESTED" \
            --allowedTools Read,Grep,Glob \
            --max-turns 10)
          echo "$REVIEW_OUTPUT" > review_result.txt

      - name: Post review as PR comment
        if: steps.changed-files.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review_result.txt', 'utf8');
            const body = `## Claude Code Review — Salesforce Apex\n\n${review}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
